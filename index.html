<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1c1a2c" />
  <title>Последний Бастион</title>
  <style>
    html,body{margin:0;height:100%;background:#1c1a2c;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 40%,#3b3360,#1c1a2c);z-index:50;transition:opacity .4s;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
    #loading .castle{width:96px;height:96px}
    #loading .bar{width:min(320px,70vw);height:12px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden}
    #loading #load-fill{height:100%;width:4%;background:linear-gradient(90deg,#ffd977,#f4a952);border-radius:8px;transition:width .25s}
    #loading #load-text{color:rgba(255,255,255,.8);font-weight:700;font-size:16px;letter-spacing:.5px}
  </style>
  <script src="/sdk.js"></script>
</head>
<body>
  <div id="app">
    <canvas id="game" tabindex="0"></canvas>
    <div id="joy" class="layer"></div>
    <div id="ui" class="layer"></div>
  </div>
  <div id="loading">
    <svg class="castle" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffe08a" d="M3 21V8h3v2h2V8h3v2h2V8h3v2h2V8h3v13h-7v-5a2 2 0 0 0-4 0v5z"/></svg>
    <div class="bar"><div id="load-fill"></div></div>
    <div id="load-text">…</div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
